services:
  # Main PHP web app
  - type: web
    name: campusgig
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: DB_HOST
        fromDatabase:
          name: campusgig-db
          property: host
      - key: DB_USER
        fromDatabase:
          name: campusgig-db
          property: user
      - key: DB_PASS
        fromDatabase:
          name: campusgig-db
          property: password
      - key: DB_NAME
        fromDatabase:
          name: campusgig-db
          property: database

# MySQL database
databases:
  - name: campusgig-db
    plan: free
    databaseName: campusgig
